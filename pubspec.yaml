    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.5+1
  icons_plus: ^5.0.0
  lottie: ^3.3.1
